<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>运动记录详情 · 散点</title><link rel="stylesheet" href="numbers.css"><style>
*{box-sizing:border-box}body{margin:0;background:#101513;color:#efefe8;font:15px/1.55 JournalDigits,system-ui,"Microsoft YaHei",sans-serif}header{padding:17px 4vw;border-bottom:1px solid #323b35;display:flex;gap:16px;align-items:baseline}header strong{font:700 32px JournalDigits,Georgia,SimSun,serif}header i{font:italic 15px JournalDigits,Georgia}header a{margin-left:auto}a{color:inherit;text-underline-offset:4px}main{max-width:1800px;margin:auto;padding:22px 4vw 48px}h1{font-size:clamp(24px,2vw,36px);margin:0 0 20px}h1 small{font-size:15px;font-weight:400;color:#b8c1b9;margin-left:12px}.layout{display:grid;grid-template-columns:minmax(290px,32%) minmax(0,1fr);gap:18px;align-items:start}.layout>div{min-width:0}.panel{background:#1c231e;border:1px solid #343d35;border-radius:9px;overflow:hidden}.panel+.panel{margin-top:18px}#map{height:clamp(320px,46vh,575px);display:grid;place-items:center}.place-label{position:absolute;transform:translate(-50%,-50%);pointer-events:none;color:#f2f3eb;text-shadow:0 0 3px black,1px 1px 2px black;font:13px JournalDigits,system-ui;white-space:nowrap}.summary,.chart,.splits{padding:clamp(14px,1.6vw,26px)}#distance{font:500 42px JournalDigits,Georgia}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0 0}.kpis dt{font-size:12px;color:#b6bfb6}.kpis dd{font:22px JournalDigits,Georgia;margin:0}.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}h2{font-size:18px;margin:0}#tabs{display:flex;flex-wrap:wrap;gap:6px}button{font:inherit;cursor:pointer;padding:5px 12px;border:1px solid #4c594e;border-radius:16px;color:#f2f0e7;background:#303a33}button[aria-pressed=true]{background:#eaece4;color:#17221a}#plot{width:100%;height:clamp(200px,28vh,380px);display:block;overflow:visible;margin:14px 0 4px}.axis{color:#acb5ac;font:12px JournalDigits,system-ui}.axis-row{display:flex;justify-content:space-between}.hint{margin:10px 0 0;color:#b5bcb2;font-size:13px}#readout{font-variant-numeric:tabular-nums;color:#f3ce91}#slider{width:100%;accent-color:#d5aa67}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:9px 8px;text-align:right;border-bottom:1px solid #333c34;white-space:nowrap}th{font-size:12px;color:#bdc4ba}th:first-child,td:first-child{text-align:left}.scroll{max-height:40vh;overflow:auto;margin-top:12px}thead{position:sticky;top:0;background:#1c231e}.nodata{padding:25px;color:#bac1b7}[hidden]{display:none!important}@media(max-width:820px){.layout{grid-template-columns:1fr}#map{height:310px}.kpis{grid-template-columns:repeat(3,1fr)}.summary{padding:12px 16px}.kpis dd{font-size:19px}main{padding:16px}header{padding:12px 16px}}
#paceRange{margin:12px 0 16px}.ramp{height:8px;border-radius:6px;background:linear-gradient(90deg,#7cb55f,#dac858 48%,#e79741 75%,#e46c54)}.rangeLabels{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#c0cbb9;margin-top:4px}.rangeLabels span:last-child{color:#ebaa89}.kpiScroll{max-height:215px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#647061 transparent}.summary .kpis{margin:0;gap:15px 12px}.kpis dd{font-size:24px}.kpis dd small{font:12px system-ui;color:#b9c1b8}.kpis dt{font-size:12px}.kpiScroll:focus-visible{outline:1px solid #bca578}
</style><link rel="stylesheet" href="journal.css"></head><body data-module="run-detail"><header><strong>散点</strong><i>Curated by &nbsp;Jayho</i><a id="back" href="running.html">← 返回跑步记录</a></header><main><h1 id="title">运动记录详情</h1><div class="layout" id="layout" hidden><div class="panel"><div id="map" aria-label="跑步轨迹和周边地名"></div><div class="summary"><b id="distance"></b> km<div id="paceRange" hidden><div class="ramp"></div><div class="rangeLabels"><span id="slow"></span><span id="fast"></span></div></div><div class="kpiScroll" tabindex="0" aria-label="本次运动指标"><dl class="kpis" id="kpis"></dl></div></div></div><div><section class="panel chart"><div class="toolbar"><h2>运动数据</h2><div id="tabs" aria-label="曲线指标"></div></div><div id="graph"><svg id="plot" viewBox="0 0 800 240" preserveAspectRatio="none" role="img"></svg><div class="axis axis-row"><span>00:00</span><span id="duration"></span></div><input type="range" id="slider" min="0" step="1" aria-label="查看曲线上各点的数值"><div id="readout"></div></div><p class="hint" id="chartNote"></p></section><section class="panel splits"><h2>分段记录</h2><div class="scroll" id="table"></div></section></div></div></main>
<script src="site.js"></script><script src="running-data.js"></script><script src="run-metrics.js"></script><script src="run-basemap.js"></script><script src="run-labels.js"></script><script src="atlas.js"></script><script src="run-geo.js"></script><script src="run-detail.js"></script></body></html>
