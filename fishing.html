<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f3;color:#242824;font-family:JournalDigits,Georgia,"Songti SC",SimSun,serif}main,header{width:min(90%,1320px);margin:auto}header{padding:23px 0;border-bottom:1px solid #c9cdc5;display:flex;align-items:baseline;gap:18px}header strong{font-size:34px}a{color:inherit;text-decoration:none}header a:last-child{margin-left:auto}h1{font-size:clamp(34px,5vw,66px);margin:34px 0 10px}p{line-height:1.65}.map{background:#17282a;color:#eaf0e6;border-radius:5px;overflow:hidden;position:relative}.map svg{display:block;width:100%;height:auto}.pin{background:#283b39;color:#fff;border:1px solid #98a69a;border-radius:20px;position:absolute;transform:translate(-50%,-50%);font:inherit;padding:6px 10px;white-space:nowrap;cursor:pointer}.pin:before{content:'●';color:#b2c6ba;margin-right:5px}.pin[aria-pressed=true]{background:#edb967;color:#172524;border-color:#edb967}.pin[aria-pressed=true]:before{color:#263631}.pin:focus-visible{outline:3px solid white;outline-offset:2px}small,.hint,time{color:#636d62}.hint{margin:0 0 17px}.records{margin:26px 0 55px}.records h2{font-size:32px;margin-bottom:4px}.entry{border-top:1px solid #cbd0c7;padding:18px 0;display:flex;gap:24px;align-items:center}.entry img{width:min(32%,260px);aspect-ratio:1.7;object-fit:cover;border-radius:4px}.entry h3{margin:6px 0}.entry p{margin:0}.map text{fill:#8da9a6;font:14px JournalDigits,Georgia,serif;letter-spacing:5px}@media(max-width:650px){.map svg{height:255px}.pin{font-size:13px}.entry{gap:12px}.entry img{width:35%}header{gap:9px}.entry p{font-size:14px}}
.catch-photos{width:min(32%,260px);display:flex;gap:8px;overflow:auto}.entry .catch-photos a{flex:0 0 100%}.entry .catch-photos img{width:100%}</style>
<header><a href="index.html"><strong>散点</strong></a><i>Curated by &nbsp;Jayho</i><a href="index.html">返回首页</a></header>
<main><h1>钓位地图</h1><p class="hint">点选岸边的钓位，翻看历次出钓。初始钓位为示例，实地记录显示经纬度。</p>
<div class="map" id="map"><svg viewBox="0 0 1000 325" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="contour" width="210" height="130" patternUnits="userSpaceOnUse" patternTransform="rotate(-15)"><g fill="none" stroke="#344440" stroke-width="1"><path d="M-10 20Q50 -5 110 20T230 20M-10 32Q50 6 110 32T230 32M-10 49Q50 21 110 49T230 49M-10 73Q50 49 110 73T230 73M-10 96Q50 69 110 96T230 96"/></g></pattern></defs><rect width="1000" height="325" fill="#23332f"/><rect width="1000" height="325" fill="url(#contour)"/><path d="M86 143 Q133 99 237 110 T411 69 Q500 29 597 69 T745 100 Q828 104 830 141 T895 183 Q928 217 806 211 T646 251 Q555 299 434 250 T259 220 Q152 246 103 209 T86 143Z" fill="#193137" stroke="#65827d" stroke-width="2"/><text x="460" y="166">水 库</text></svg></div>
<section class="records" aria-live="polite"><h2 id="spot"></h2><p id="summary"></p><div id="visits"></div></section></main>
<script src="site.js"></script><script src="journal-data.js"></script><script src="atlas.js"></script><script>
const spots=journal.spots;
const map=document.getElementById('map');
let geographicMap;
function selectSpot(spot){
 if(spot.point)geographicMap?.focus(spot.point);
 for(const pin of map.querySelectorAll('.pin')) pin.setAttribute('aria-pressed',String(pin.textContent===spot.name));
 document.getElementById('spot').textContent=spot.name;
 document.getElementById('summary').textContent=spot.visits.length+' 次出钓'+(spot.point?' · '+spot.point.join(', '):' · 示意钓位');
 const entries=[...spot.visits].sort((a,b)=>b.date.localeCompare(a.date));
 document.getElementById('visits').innerHTML=entries.map(v=>'<article class="entry"><div class="catch-photos">'+(v.photos||[v.photo]).map(f=>'<a href="'+esc(f)+'.jpg"><img src="'+esc(f)+'.jpg" alt="'+esc(v.alt||v.title)+'"></a>').join('')+'</div><div><time datetime="'+esc(v.date)+'">'+esc(v.date)+'</time><h3>'+esc(v.title)+'</h3><p>'+esc(v.note)+'</p></div></article>').join('');
}
for(const spot of spots.filter(s=>!s.point)){
 const pin=document.createElement('button');pin.className='pin';pin.textContent=spot.name;
 pin.style.left=spot.x+'%';pin.style.top=spot.y+'%';pin.onclick=()=>selectSpot(spot);map.append(pin);
}
const actual=spots.filter(s=>s.point);
if(actual.length){
 const section=document.createElement('div');section.style.height='350px';section.setAttribute('aria-label','实地钓位地图');map.before(section);
 geographicMap=atlas(section,{center:actual[0].point,markers:actual.map(s=>({name:s.name,point:s.point})),onMarker:m=>selectSpot(actual.find(s=>s.name===m.name))});
 const list=document.createElement('div');section.after(list);for(const spot of actual){const b=document.createElement('button');b.textContent=spot.name;b.onclick=()=>{selectSpot(spot);section.scrollIntoView({block:'center'})};list.append(b)}
}
const initial=spots.find(s=>encodeURIComponent(s.name)===location.hash.slice(1))||actual[0]||spots[0];
if(initial)selectSpot(initial);
</script></html>
